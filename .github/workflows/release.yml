# Construit l'installateur Windows et l'attache à une Release GitHub
# dès qu'un tag de version est poussé (ex. : git tag v1.0.1 && git push origin v1.0.1).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - run: npm ci

      - name: Construire l'installateur
        run: npx electron-builder --win nsis --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-Launcher-Setup
          path: launcher/dist/*.exe

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher/dist/*.exe
            launcher/dist/*.exe.blockmap
          generate_release_notes: true
